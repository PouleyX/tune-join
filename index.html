<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Rejoindre l'écoute · Tune</title>
<meta property="og:title" content="Rejoindre l'écoute sur Tune" />
<meta property="og:description" content="Un clic pour écouter la même musique, en même temps." />
<style>
  :root { color-scheme: dark; --ink: #f5f3fa; --ink-2: rgba(245,243,250,.7); --ink-3: rgba(245,243,250,.44); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(900px circle at 30% 20%, #3a1f6b, transparent 60%), radial-gradient(700px circle at 80% 90%, #6b1f4a, transparent 60%), #07070b;
    color: var(--ink); font: 15px/1.5 "Geist", ui-sans-serif, system-ui, sans-serif; }
  .card { width: min(420px, 100%); padding: 28px; border-radius: 28px; text-align: center; background: linear-gradient(140deg, rgba(255,255,255,.13), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(26px); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 30px 60px -30px rgba(0,0,0,.8); }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  h1 { margin: 6px 0 10px; font-size: 30px; letter-spacing: -.04em; line-height: 1.05; }
  p { margin: 0 0 20px; color: var(--ink-2); }
  a.btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; padding: 0 26px; border-radius: 999px; background: var(--ink); color: #0b0b10; font-weight: 700; text-decoration: none; }
  .code { margin-top: 22px; font-size: 12.5px; color: var(--ink-3); }
  .code button { margin-top: 8px; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: var(--ink); font: 12px ui-monospace, monospace; word-break: break-all; cursor: pointer; }
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Tune</div>
  <h1>Rejoindre l'écoute</h1>
  <p id="msg">Ouverture de Tune…</p>
  <a class="btn" id="open" href="#">Ouvrir dans Tune</a>
  <div class="code">Ça ne s'ouvre pas ? Copie ce code et colle-le dans Tune (bouton « Écouter à plusieurs ») :
    <button id="code" type="button" title="Copier"></button>
  </div>
</main>
<script>
  // Le code du salon (avec sa clé de chiffrement) est après le # : il n'est jamais envoyé au serveur.
  const code = (location.hash || "").replace(/^#/, "").replace(/^c=/, "").trim();
  const ok = /^[A-Za-z0-9_-]{30,40}$/.test(code);
  const link = "tune://join/" + code;
  const btn = document.getElementById("open"), box = document.getElementById("code"), msg = document.getElementById("msg");
  if (!ok) {
    msg.textContent = "Ce lien d'invitation est incomplet.";
    btn.style.display = "none";
    box.parentElement.style.display = "none";
  } else {
    btn.href = link;
    box.textContent = code;
    box.onclick = () => navigator.clipboard.writeText(code).then(() => (box.textContent = "Copié !"));
    setTimeout(() => { location.href = link; }, 300);
    setTimeout(() => { msg.textContent = "Si Tune ne s'est pas ouvert, clique sur le bouton."; }, 2500);
  }
</script>
</body>
</html>
